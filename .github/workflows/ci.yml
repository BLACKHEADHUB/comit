name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps/LayoutProps는 next가 만들어 주는 타입이라 먼저 생성해야 한다
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Use webpack in CI: Turbopack's next/font/google internal resolver currently
      # fails on the hosted runner for the Korean font used by the app shell.
      - run: npm run build -- --webpack
        env:
          MONGODB_URI: mongodb://localhost:27017/ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run e2e -- --skip-build --project=desktop-light --no-deps e2e/submission-concurrency.spec.ts
